{{ with .Values.policyException }}
{{ if tpl .enabled $ | toString | eq "true" }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: cert-manager-webhook
  namespace: {{ .namespace | default $.Release.Namespace }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyRefs:
    - {name: require-run-as-nonroot, kind: ValidatingPolicy}
    - {name: enforce-security-context, kind: MutatingPolicy}
  matchConditions:
    - name: cert-manager-webhook-opentelekomcloud
      expression: >-
        object.metadata.namespace == '{{ $.Release.Namespace }}' &&
        (has(object.metadata.name) ? object.metadata.name : object.metadata.generateName).contains('cert-manager-webhook-opentelekomcloud')
{{- end }}
{{- end }}
