argo-cd:
  fullnameOverride: "argocd"

  global:
    logging:
      format: "json"
      level: "warn"
    # the /argocd suffix is required for oidc to resolve callback url correct
    # there is an unfixed bug report in argocd: https://github.com/argoproj/argo-cd/issues/23694
    domain: "REPLACE_THIS/argocd"
    networkPolicy:
      create: false

  controller:
    replicas: 2
    env:
      - name: "TZ"
        value: "Europe/Berlin"
    # resources equivalent to Bitnami setting "medium"
    # see https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 750m
        memory: 1536Mi
        ephemeral-storage: 2Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  redis-ha:
    enabled: true

  applicationSet:
    replicas: 2

  dex:
    enabled: false

  notifications:
    enabled: false

  repoServer:
    replicas: 2
    env:
      - name: "TZ"
        value: "Europe/Berlin"
    # resources equivalent to Bitnami setting "small"
    # see https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 750m
        memory: 768Mi
        ephemeral-storage: 2Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  server:
    replicas: 2
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    ingress:
      enabled: true
      hostname: "REPLACE_THIS"
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      path: &ingressPath "/argocd"
    env:
      - name: "TZ"
        value: "Europe/Berlin"

  configs:
    cm:
      # -- OIDC settings in a multiline string
      # @default -- refer to values.yaml
      oidc.config: |
        name: keycloak
        issuer: $argocd-oidc:oidcURL
        clientID: $argocd-oidc:clientID
        clientSecret: $argocd-oidc:clientSecret
        requestedScopes:
          - openid
          - profile
          - email
        requestedIDTokenClaims:
          groups:
            essential: true

      resource.customizations.ignoreDifferences.argoproj.io_Application: |
        # Ignores .data changes of all secrets with a vaultInjectionChecksum annotation
        jqPathExpressions:
          - '. | select(.metadata.annotations.parametersChecksum) | .spec.source.helm'
          - '. | select(.metadata.annotations.valueFileChecksum) | .spec.source.helm'
      resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
        # Ignores caBundle and template changes of the following resources
        jqPathExpressions:
          - .metadata.annotations.template
          - '.webhooks'
      resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        jqPathExpressions:
          - .spec.conversion.webhookClientConfig.caBundle
      resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
        jqPathExpressions:
          - .metadata.annotations.template
          - '.webhooks[]?.clientConfig.caBundle'
          - '.webhooks'
      resource.customizations.ignoreDifferences.cert-manager.io_Certificate: |
        jqPathExpressions:
          - .spec.duration
      resource.customizations.health.networking.k8s.io_Ingress: |
        hs = {}
        hs.status = "Healthy"
        return hs

    rbac:
      # -- RBAC settings in a multiline string
      # @default -- refer to values.yaml
      policy.csv: |
        g, read-only, role:readonly
        g, full-access, role:admin

        # Grant rights to read and do rollouts + restarts limited to customer apps
        p, role:app-deploy, *, get, app-charts/*, allow
        p, role:app-deploy, applications, sync, app-charts/*, allow
        p, role:app-deploy, *, action/apps/*/restart, app-charts/*, allow
        g, app-deploy, role:app-deploy

        # Grant rights to read and do rollouts + restarts limited to infrastructure apps
        p, role:infra-deploy, *, get, infrastructure-charts/*, allow
        p, role:infra-deploy, applications, sync, infrastructure-charts/*, allow
        p, role:infra-deploy, *, action/apps/*/restart, infrastructure-charts/*, allow
        g, infra-deploy, role:infra-deploy
      scopes: "[client_roles]"

    params:
      server.insecure: true
      server.rootpath: *ingressPath
      server.basehref: *ingressPath
      applicationsetcontroller.policy: 'sync'

# Please use argocd-secret chart instead if you are using keycloak deployed in the same stage to avoid cyclic dependencies.
#     secret:

# Kyverno Policy Exception
policyException:
  enabled: true

# Deploy PrometheusRule's which can be picked up by prometheus alertmanager for alerting
# Requires the prometheus-operator CRDs to be installed in the cluster!
# Requires ArgoCD controller metrics to have an effect
prometheusRule:
  enabled: true
  additionalLabels: {}
  # Alerting rules keyed by alert name
  # Single rules can be disabled via <AlertName>.disabled: true
  rules:
    ApplicationDegraded:
      # disabled: true
      expr: argocd_app_info{project="infrastructure-charts", health_status=~"Degraded|Missing|Unknown"}
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.name }} is {{ $labels.health_status }}'
        description: 'ArgoCD application {{ $labels.namespace }}/{{ $labels.name }} has health {{ $labels.health_status }}.'
    ApplicationProgressingTooLong:
      # disabled: true
      expr: argocd_app_info{project="infrastructure-charts", health_status="Progressing"}
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.name }} stuck in Progressing'
        description: 'ArgoCD application {{ $labels.namespace }}/{{ $labels.name }} has been Progressing for over 1h.'
    ApplicationSyncFailing:
      # disabled: true
      expr: >
        increase(argocd_app_sync_total{project="infrastructure-charts", phase=~"Failed|Error"}[1h]) > 0
        and on (namespace, name)
        argocd_app_info{project="infrastructure-charts", sync_status!="Synced"}
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.name }} sync failing'
        description: 'ArgoCD application {{ $labels.namespace }}/{{ $labels.name }} has recent failed syncs and is still not Synced.'
    ApplicationOutOfSync:
      # disabled: true
      expr: argocd_app_info{project="infrastructure-charts", sync_status!="Synced", autosync_enabled="true"}
      for: 2h
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.name }} not synced'
        description: 'ArgoCD application {{ $labels.namespace }}/{{ $labels.name }} is {{ $labels.sync_status }} despite auto-sync.'
    ApplicationSyncStuck:
      # disabled: true
      expr: argocd_app_info{project="infrastructure-charts", operation="sync"}
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.name }} sync operation stuck'
        description: 'ArgoCD application {{ $labels.namespace }}/{{ $labels.name }} has had a sync operation running for over 30m.'

