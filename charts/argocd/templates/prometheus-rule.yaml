{{ with .Values.prometheusRule }}
{{- $anyRuleEnabled := false }}
{{- range .rules }}
{{- if and . .enabled }}{{- $anyRuleEnabled = true }}{{- end }}
{{- end }}
{{ if and .enabled $anyRuleEnabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-applications
  {{- with .additionalLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: argocd-applications
      rules:
        {{- range $alertName, $rule := .rules }}
        {{- if and $rule $rule.enabled }}
        - alert: {{ $alertName }}
          {{- omit $rule "enabled" | toYaml | nindent 10 }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
