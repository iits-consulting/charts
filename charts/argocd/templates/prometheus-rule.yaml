{{ with .Values.prometheusRule }}

{{/* Check that there is at least one active rule, otherwise there is a rendering issue */}}
{{- $anyRuleEnabled := false }}
{{- range .rules }}
{{- if and . (not .disabled) }}{{- $anyRuleEnabled = true }}{{- end }}
{{- end }}
{{/* End of check */}}

{{ if and .enabled $anyRuleEnabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-applications
  {{- with .additionalLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: argocd-applications
      rules:
        {{- range $alertName, $rule := .rules }}
        {{- if and $rule (not $rule.disabled) }}
        - alert: {{ $alertName }}
          {{- omit $rule "disabled" | toYaml | nindent 10 }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
