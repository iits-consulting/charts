{{ with .Values.policyException }}
{{ if .enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: argocd-repo-server
  namespace: {{ .namespace | default $.Release.Namespace }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyRefs:
    - {name: restrict-seccomp-strict, kind: ValidatingPolicy}
    - {name: restrict-seccomp, kind: ValidatingPolicy}
    - {name: enforce-security-context, kind: MutatingPolicy}
  matchConditions:
    # Exclude argocd-repo-server, otherwise this error occurs: "getaddrinfo() thread failed to start"
    - name: argocd-repo-server
      expression: >-
        object.metadata.namespace == '{{ $.Release.Namespace }}' &&
        (has(object.metadata.name) ? object.metadata.name : object.metadata.generateName).startsWith('argocd-repo-server')
{{- end }}
{{- end }}
