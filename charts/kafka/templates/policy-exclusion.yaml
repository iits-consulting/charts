{{ with .Values.policyException }}
{{ if .enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: kafka
  namespace: {{ .namespace | default $.Release.Namespace }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyRefs:
    - {name: require-run-as-non-root-user, kind: ValidatingPolicy}
    - {name: enforce-security-context, kind: MutatingPolicy}
  matchConditions:
    - name: kafka-pods
      expression: >-
        object.metadata.namespace == '{{ $.Release.Namespace }}' &&
        (has(object.metadata.name) ? object.metadata.name : object.metadata.generateName).startsWith('kafka')
{{- end }}
{{- end }}
