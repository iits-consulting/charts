kafka:
  image:
    repository: bitnamilegacy/kafka
  replicaCount: 3
  maxMessageBytes: _52428800
  autoCreateTopicsEnable: true

  #this has to be disabled to get rid of autoCreateTopicsEnable, which should not be enabled on production.
  deleteTopicEnable: false

  metrics:
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: true
    kafka:
      enabled: true
    jmx:
      enabled: true
      image:
        repository: bitnamilegacy/jmx-exporter

  persistence:
    size: 30G

# Kyverno Policy Exception
policyException:
  enabled: true
  # Namespace of the PolicyException, defaults to the release namespace.
  # Kyverno must read exceptions from it (kyverno.features.policyExceptions.namespace)
  namespace: ""
  # Labels added to the PolicyException
  labels: {}
  # Annotations added to the PolicyException, merged with these defaults
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
