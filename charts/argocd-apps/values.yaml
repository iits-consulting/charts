global:
  syncWindow:
  - kind: allow
    schedule: '* * * * *'
    manualSync: true
    duration: 24h

# ? Idea: Add the possibility to add a repo to an existing project - currently it's 1:1
# -- List of projects with applications which you want to create
projects: {}
