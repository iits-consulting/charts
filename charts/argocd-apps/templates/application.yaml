{{ range $projectName,$project := .Values.projects }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $projectName }}
spec:
  project: {{ $projectName }}
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      {{- if $project.serverSideApply}}
      - ServerSideApply=true
      {{- end}}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Release.Namespace }}
  {{- $mainSource := include "argocd-apps.mainSource" (dict "projectName" $projectName "project" $project) }}
  {{- with $project.valuesSource }}
  sources:
    - {{ $mainSource | indent 6 | trim }}
    - repoURL: {{ .repoUrl | required "valuesSource.repoUrl is required when valuesSource is set" }}
      targetRevision: {{ .branch | default "HEAD" }}
      ref: valuesSource
  {{- else }}
  source:
    {{- $mainSource | nindent 4 }}
  {{- end }}
---
{{- end }}
