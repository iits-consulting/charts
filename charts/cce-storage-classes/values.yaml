# -- Set this to encrypt all ssd volumes by default
kmsId:
evsTypes:
  - "SSD"
  - "SATA"
defaultClass:
  type: "SSD"
  retention: "Retain"
evs:
  # -- volumeBindingMode of all `csi-disk-*` classes. Set to "WaitForFirstConsumer" to defer EVS disk
  # provisioning until a pod is scheduled, avoiding zone mismatches between the PV and the scheduled pod.
  volumeBindingMode: "Immediate"
sfsturbo:
  # -- volumeBindingMode of all `csi-sfsturbo-*` classes. Set to "WaitForFirstConsumer" to defer SFS Turbo
  # provisioning until a pod using the PVC is scheduled.
  volumeBindingMode: "Immediate"
