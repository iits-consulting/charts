{{- /*
Customized copy of the 'CPUThrottlingHigh' alert from the 'kubernetes-resources' rule group of
kube-prometheus-stack (templates/prometheus/rules-1.14/kubernetes-resources.yaml).
Do not change in-place! When upgrading the dependency, re-render the upstream alert and re-apply the deviations.

Deviations from upstream:
  - threshold raised from 25% to 75%
  - the kube-system namespace is excluded

The rest of the 'kubernetes-resources' group is rendered unmodified by the subchart itself
(defaultRules.rules.kubernetesResources: true), while upstream's own CPUThrottlingHigh is turned
off via defaultRules.disabled.CPUThrottlingHigh so only this customized alert exists.
*/ -}}
{{- if and .Values.prometheusStack.defaultRules.create .Values.prometheusStack.defaultRules.rules.kubernetesResources }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-%s" (include "kube-prometheus-stack.fullname" .) "cpu-throttling-high" | trunc 63 | trimSuffix "-" }}
  namespace: {{ template "kube-prometheus-stack.namespace" . }}
  labels:
    app: {{ template "kube-prometheus-stack.name" . }}
{{ include "kube-prometheus-stack.labels" . | indent 4 }}
{{- if .Values.prometheusStack.defaultRules.labels }}
{{ toYaml .Values.prometheusStack.defaultRules.labels | indent 4 }}
{{- end }}
{{- if .Values.prometheusStack.defaultRules.annotations }}
  annotations:
{{ toYaml .Values.prometheusStack.defaultRules.annotations | indent 4 }}
{{- end }}
spec:
  groups:
    - name: cpu-throttling-high
      rules:
        - alert: CPUThrottlingHigh
          annotations:
            description: '{{`{{`}} $value | humanizePercentage {{`}}`}} throttling of CPU in namespace {{`{{`}} $labels.namespace {{`}}`}} for container {{`{{`}} $labels.container {{`}}`}} in pod {{`{{`}} $labels.pod {{`}}`}} on cluster {{`{{`}} $labels.cluster {{`}}`}}.'
            runbook_url: {{ .Values.prometheusStack.defaultRules.runbookUrl }}/kubernetes/cputhrottlinghigh
            summary: Processes experience elevated CPU throttling.
          expr: |-
            sum without (id, metrics_path, name, image, endpoint, job, node) (
              topk by (cluster, namespace, pod, container, instance) (1,
                increase(
                  container_cpu_cfs_throttled_periods_total{container!="", namespace!="kube-system", job="kubelet", metrics_path="/metrics/cadvisor"}
                [5m])
              )
            )
            / on (cluster, namespace, pod, container, instance) group_left
            sum without (id, metrics_path, name, image, endpoint, job, node) (
              topk by (cluster, namespace, pod, container, instance) (1,
                increase(
                  container_cpu_cfs_periods_total{job="kubelet", metrics_path="/metrics/cadvisor"}
                [5m])
              )
            )
            > ( 75 / 100 )
          for: 15m
          labels:
            severity: info
{{- if .Values.prometheusStack.defaultRules.additionalRuleLabels }}
{{ toYaml .Values.prometheusStack.defaultRules.additionalRuleLabels | indent 8 }}
{{- end }}
{{- end }}
