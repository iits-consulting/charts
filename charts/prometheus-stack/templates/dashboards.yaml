{{- if .Values.dashboards.enabled -}}
  {{- /* Picks all folders under dashboards and puts them into $dashboards as list  */ -}}
  {{- $dashboards := list -}}
  {{- range $path, $_ := .Files.Glob "dashboards/*/*.json" -}}
    {{- $dashboards = append $dashboards (dir $path) -}}
  {{- end -}}
  {{- $dashboards = $dashboards | sortAlpha | uniq -}}

  {{- /* Iterate over all found subfolders with fullpath. If files exist and subfolder is in ".Values.dashboards.include" list -> render.  */ -}}
  {{- range $idx, $fullPath := $dashboards }}
    {{- $folder := trimPrefix "dashboards/" $fullPath }}
    {{- $files := $.Files.Glob (printf "dashboards/%s/*.json" $folder) }}
    {{- if and (has $folder $.Values.dashboards.include) $files }}
      {{- range $path, $fileContents := $files }}
      {{- $dashboardName := regexReplaceAll "(^.*/)(.*)\\.json$" $path "${2}" }}
      {{- $catalogName := regexReplaceAll "(^.*/)(.*)\\.json$" $path "${1}" }}
      {{- $shortCatalogName := trimPrefix "dashboards/" $catalogName | trimSuffix "/" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s-%s" (include "monitor.fullname" $ | trunc 58) $shortCatalogName $dashboardName | trunc 63  | trimSuffix "-" | replace "_" "-" }}
  labels:
    {{ $.Values.prometheusStack.grafana.sidecar.dashboards.label }}: {{ $.Values.prometheusStack.grafana.sidecar.dashboards.labelValue | quote }}
  annotations:
    {{ $.Values.prometheusStack.grafana.sidecar.dashboards.folderAnnotation }}: {{ printf "/tmp/%s" $catalogName | trimSuffix "/"}}
data:
  {{ $dashboardName }}.json: |-
    {{- $.Files.Get $path | nindent 4 }}
      {{- end }}
    {{- end }}
  {{- end}}

{{- end }}
