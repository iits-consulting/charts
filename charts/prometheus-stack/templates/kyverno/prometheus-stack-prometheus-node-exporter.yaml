{{ with .Values.policyException }}
{{ if .enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: prometheus-stack-prometheus-node-exporter
  namespace: {{ .namespace | default $.Release.Namespace }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyRefs:
    - {name: restrict-volume-types, kind: ValidatingPolicy}
    - {name: disallow-host-namespaces, kind: ValidatingPolicy}
    - {name: disallow-host-ports, kind: ValidatingPolicy}
    - {name: disallow-host-path, kind: ValidatingPolicy}
  matchConditions:
    - name: node-exporter-pods
      expression: >-
        object.metadata.namespace == '{{ $.Release.Namespace }}' &&
        (has(object.metadata.name) ? object.metadata.name : object.metadata.generateName).startsWith('prometheus-stack-prometheus-node-exporter')
{{- end }}
{{- end }}
