{{- with .Values.ingress.kibana -}}
{{- if eq .enabled true }}
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ $.Release.Name }}-kibana
spec:
  serverName: {{ $.Release.Name }}-kb-http
  rootCAs:
    - secret: {{ $.Release.Name }}-kb-http-certs-public
{{- end }}
{{- end }}
