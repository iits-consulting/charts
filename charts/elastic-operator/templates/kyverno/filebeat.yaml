{{ with .Values.policyException }}
{{ if .enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ $.Release.Namespace }}-{{$.Release.Name}}-fb
  namespace: {{ .namespace | default $.Release.Namespace }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyRefs:
    - {name: enforce-security-context, kind: MutatingPolicy}
    - {name: disallow-capabilities-strict, kind: ValidatingPolicy}
    - {name: disallow-host-namespaces, kind: ValidatingPolicy}
    - {name: disallow-host-path, kind: ValidatingPolicy}
    - {name: disallow-privilege-escalation, kind: ValidatingPolicy}
    - {name: require-run-as-non-root-user, kind: ValidatingPolicy}
    - {name: require-run-as-nonroot, kind: ValidatingPolicy}
    - {name: restrict-seccomp-strict, kind: ValidatingPolicy}
    - {name: restrict-volume-types, kind: ValidatingPolicy}
  matchConditions:
    - name: filebeat-pods
      expression: >-
        object.metadata.namespace == '{{ $.Release.Namespace }}' &&
        (has(object.metadata.name) ? object.metadata.name : object.metadata.generateName).startsWith('{{ $.Release.Name }}-beat-filebeat-')
{{- end }}
{{- end }}
