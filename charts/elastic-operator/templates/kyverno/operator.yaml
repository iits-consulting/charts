{{ with .Values.policyException }}
{{ if .enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ $.Release.Namespace }}-{{$.Release.Name}}-op
  namespace: {{ .namespace | default $.Release.Namespace }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyRefs:
    - {name: restrict-seccomp-strict, kind: ValidatingPolicy}
  matchConditions:
    - name: operator-pods
      expression: >-
        object.metadata.namespace == '{{ $.Release.Namespace }}' &&
        (has(object.metadata.name) ? object.metadata.name : object.metadata.generateName).matches('^{{ $.Release.Name }}-.$')
{{- end }}
{{- end }}
