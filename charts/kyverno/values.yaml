kyverno:

  features:
    policyExceptions:
      enabled: true
      # -- Only PolicyExceptions of this namespace are honored. `*` honors every namespace, so anyone who can
      # create a PolicyException can bypass the policies.
      namespace: "*"
    logging:
      format: json

  admissionController:
    replicas: 2
    serviceMonitor:
      enabled: true
    rbac:
      clusterRole:
        extraResources:
          # ImageValidatingPolicy credentials (`imagesAndPublicKeyPairs[].pullSecret`)
          - apiGroups:
              - ''
            resources:
              - secrets
            verbs:
              - list
              - get
              - watch

  backgroundController:
    serviceMonitor:
      enabled: true
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 300m
        memory: 512Mi
    rbac:
      clusterRole:
        extraResources:
          # The GeneratingPolicies clone pull secrets into namespaces, `watch` keeps the copies in sync
          - apiGroups:
              - ''
            resources:
              - secrets
            verbs:
              - list
              - get
              - watch
              - create
              - update
              - delete
              - patch

  cleanupController:
    serviceMonitor:
      enabled: true

  reportsController:
    serviceMonitor:
      enabled: true
    rbac:
      clusterRole:
        extraResources:
          # Needed by disallow-unspecified-docker-registries and disallow-latest-tag, which also match pods/ephemeralcontainers
          - apiGroups:
              - ''
            resources:
              - pods/ephemeralcontainers
            verbs:
              - get
              - list
              - watch

  grafana:
    enabled: true

  crds:
    install: false

  existingImagePullSecrets: [ ]


policy-reporter:
  install: true

  logging:
    encoding: json

  # We explicitly remove all filters, since we want a complete dashboard
  sourceFilters: [ ]

  ui:
    enabled: true
    logging:
      encoding: json
    # openIDConnect:
      # supported keys: `discoveryUrl`, `clientId`, `clientSecret`, `certificate`, `skipTLS`
      # For reference, if External Secrets is used for OIDC. Value has to match the name of the generated ESO secret under `common.externalSecret.pull`
      # secretRef: "kyverno-policy-reporter-ui-oidc"

  metrics:
    enabled: true

  monitoring:
    enabled: true


  plugin:
    kyverno:
      enabled: true
      logging:
        encoding: json


kyverno-policies:
  # -- Whether to install the default policies for kyverno
  install: true
  # -- The pod security standard as defined in https://kyverno.io/policies/pod-security.
  podSecurityStandard: "restricted"
  # -- Exclude kube-system Pods since we can not change them. Applies to every policy that has no vpolExcludeByPolicy entry.
  vpolExclude:
    excludeNamespaces:
      - kube-system


prependCustomImageRegistry:
  # -- Enable or disable the policy globally
  enabled: false

  # -- The name of the policy
  name: prepend-image-registry

  # -- `Fail` rejects the request when Kyverno is unavailable or the webhook times out, `Ignore` admits it
  failurePolicy: Fail

  # -- The registry prepended to every image. Must not be enabled together with `replaceImageRegistry`.
  registry: "mysecure-registry.example.com"

  # -- Images that are left alone. Wildcards (`*` any characters including `/`, `?` one character) are matched against
  # the image reference as written in the Pod.
  excludeRegistries: [ ]

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]


# Replace the registry of all images with a specific one, usually a pull through cache
replaceImageRegistry:
  # -- Enable or disable the policy globally
  enabled: false

  # -- The name of the policy
  name: replace-image-registry

  # -- `Fail` rejects the request when Kyverno is unavailable or the webhook times out, `Ignore` admits it
  failurePolicy: Fail

  # -- The registry (and path) every image is pulled from instead
  target: "mysecure-registry/common-signed-docker-images"

  # -- `true` keeps the repository path (`ghcr.io/org/app:v1` becomes `<target>/org/app:v1`), `false` only the image
  # name (`<target>/app:v1`), where `org1/app` and `org2/app` collide. Must not be enabled together with `prependCustomImageRegistry`.
  keepRepositoryPath: true

  # -- Images that are left alone. Wildcards (`*` any characters including `/`, `?` one character) are matched against
  # the image reference as written in the Pod.
  excludeRegistries: [ ]
  #  - "docker.io/something/*"

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]
  # - my-namespace

# Verifies that images are signed with cosign
disallowUnsignedImages:
  # -- Enable or disable the policy globally
  enabled: false

  # -- The name of the policy
  name: disallow-unsigned-images

  # -- Webhook timeout in seconds (max 30)
  timeoutSeconds: 30

  # -- `Ignore` admits Pods when the webhook fails or times out (for example an unreachable registry), so a slow
  # registry or Kyverno skips the check. Kept as in 3.5.1, set `Fail` for fail-closed verification.
  failurePolicy: Ignore

  # -- Images and the public key they are verified with. `image` is a wildcard (`*`, `?`) that must start with the
  # registry (`docker.io/iits/*` works, `iits/*` does not). Pairs are ANDed: an image matching two pairs needs both
  # signatures, so keep the patterns disjoint. `pullSecret` names a Secret of the Kyverno namespace for private
  # registries. `ignoreTransparencyLog` defaults to true (no Rekor entry, as with `cosign sign --key --tlog-upload=false`),
  # set it to false for signatures uploaded to a transparency log. The policy is always enforced (no Audit mode) and
  # writes no PolicyReport results.
  imagesAndPublicKeyPairs:
    - image: "*"
      #pullSecret:
      #ignoreTransparencyLog: true
      key: |-
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEXzV8f2YUEmXF176k//uSmgEEZoKb
        g2b7+PuoKjfaYVw3HTAE2Z4ak5ZNNq5HF8G1cRt3P713MyuIXiNKP6v2Nw==
        -----END PUBLIC KEY-----

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]
  #  - my-namespace

# Only allow images coming from a specific list of registries
disallowUnspecifiedDockerRegistries:
  # -- Enable or disable the policy globally
  enabled: false

  # -- The name of the policy
  name: disallow-unspecified-docker-registries

  # -- `Fail` rejects the request when Kyverno is unavailable or the webhook times out, `Ignore` admits it
  failurePolicy: Fail

  # -- List of allowed registries. Wildcards are supported: `*` matches any characters (including `/`), `?` one character.
  # An image is allowed if its reference as written or its normalized form (`nginx` is
  # `docker.io/library/nginx:latest`) matches. There are no image exceptions: widen the list, exclude the namespace
  # or use a PolicyException.
  allowedRegistries:
    - "mysecure-registry/common-signed-docker-images/*"

  # -- `Enforce` rejects violating resources, `Audit` admits them and reports the violation (case insensitive).
  validationAction: "Enforce"

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]
  # - my-namespace

# Fills the securityContext of Pods with the Pod Security Standards restricted settings. The fixed settings
# (runAsNonRoot, RuntimeDefault seccomp, no privilege escalation, drop ALL) have no knobs by design.
enforceSecurityContext:
  # -- Enable or disable the policy globally
  enabled: false

  # -- The name of the policy
  name: enforce-security-context

  # -- `Fail` rejects the request when Kyverno is unavailable or the webhook times out, `Ignore` admits it
  failurePolicy: Fail

  # -- Default `runAsUser` of Pods that set none. Unset by default: a fixed UID breaks images that need their own
  # UID, images that run as root then fail to start because `runAsNonRoot` is true.
  runAsUser:

  # -- Default `runAsGroup` of Pods that set none. Unset by default.
  runAsGroup:

  # -- Default `readOnlyRootFilesystem: true` for containers that set none. Opt-in, many images write to their root
  # filesystem.
  readOnlyRootFilesystem: false

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]
  # - my-namespace

# Adds pull secrets to the imagePullSecrets of Pods and, for `secrets` and `existingSecretRef`, clones them into the
# namespaces first. Every entry takes an optional `namespaces` list (wildcards `*`, `?`, default all namespaces) and an
# optional `namespaceSelector` (`matchLabels`, `matchExpressions` on the namespace labels). Both limit the clone and
# the injection, a namespace must match both. See "Image pull secrets" in the README. The policy names
# (`add-image-pull-secret`, `auto-create-docker-*`) are fixed.
autoInjectDockerPullSecrets:
  # -- Enable or disable the policies globally. The credentials of `secrets` are only stored in the Secret
  # `pull-secret-<key>` of the release namespace, not in a policy.
  enabled: false

  # -- Namespaces (wildcards `*`, `?`) that receive no Secret clone and whose Pods get no imagePullSecrets, wins over
  # `namespaces` and `namespaceSelector` of an entry. The namespace of a cloned Secret is never a target. Helm replaces lists, repeat the
  # defaults when you add entries.
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease

  # -- `failurePolicy` of the Pod mutation
  failurePolicy: Fail

  # -- Secrets that already exist in their target namespaces, for example created per namespace by an External Secrets
  # `ClusterExternalSecret`. Only added to the imagePullSecrets of Pods, never cloned. Keep `namespaces` in line with
  # the namespaces the secret exists in (`namespaceSelector` can mirror the `namespaceSelectors` of a
  # `ClusterExternalSecret`). Recommended for External Secrets.
  injectOnly: []
  # - name: ps-x
  #   namespaces: [team-a, team-b]
  # - name: ps-y
  #   namespaceSelector:
  #     matchLabels:
  #       pull-secret/ps-y: "true"

  # -- Existing Secrets of type `kubernetes.io/dockerconfigjson` that Kyverno clones from `namespace` (default the
  # release namespace) into the target namespaces. Changes of the source reach the clones, deleting it deletes them.
  existingSecretRef: []
  # - name: pull-secret-dockerhub
  #   namespace: kyverno
  # - name: pull-secret-mycustomregistry
  #   namespace: mycustomnamespace
  #   namespaces: [team-*]

  # -- Allow cloning a `common.externalSecret.pull.secrets` entry through `existingSecretRef` without
  # `creationPolicy: Orphan`. Deleting or replacing that ExternalSecret then deletes every clone, and Kyverno does not
  # recreate them in existing namespaces when the source returns.
  allowOwnedExternalSecret: false

  # -- Pull secrets to create from the chart values, by key. The chart creates `pull-secret-<key>` in the release
  # namespace and Kyverno clones it into the target namespaces.
  secrets: {}
  #  gitlab:
  #    username: "access_token"
  #    password: "token or password"
  #    registryUrl: "registry.gitlab.com"
  #    namespaces: [team-a]

# Every rule of an Ingress must define a host. Ingresses without rules are not affected. Blocks Ingress changes
# cluster wide while Kyverno is down (`failurePolicy: Fail`), set `Ignore` if that is not acceptable.
disallowEmptyIngressHost:
  # -- Enable or disable the policy globally
  enabled: true

  # -- The name of the policy
  name: disallow-empty-ingress-host

  # -- `Fail` rejects the request when Kyverno is unavailable or the webhook times out, `Ignore` admits it
  failurePolicy: Fail

  # -- How policy violation should be handled. Use either `Enforce` or `Audit` (case insensitive).
  validationAction: "Enforce"

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]
  # - my-namespace

  # -- Exclude single Ingresses, a list of `{name, namespace}`. Both fields support wildcards (`*`, `?`) and templates
  # (for example `{{ .Release.Namespace }}`).
  excludeIngresses: [ ]
  # - name: ingressname
  #   namespace: namespace


# Opt-in policies adapted from https://github.com/kyverno/policies. They default to Audit and only
# report violations until validationAction is set to Enforce.
disallowLatestTag:
  # -- Enable or disable the policy globally
  enabled: false

  # -- The name of the policy
  name: disallow-latest-tag

  # -- `Fail` rejects the request when Kyverno is unavailable or the webhook times out, `Ignore` admits it
  failurePolicy: Fail

  # -- How policy violation should be handled. Use either `Enforce` or `Audit` (case insensitive).
  validationAction: "Audit"

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]

restrictIngressWildcard:
  # -- Enable or disable the policy globally
  enabled: false

  # -- The name of the policy
  name: restrict-ingress-wildcard

  # -- `Fail` rejects the request when Kyverno is unavailable or the webhook times out, `Ignore` admits it
  failurePolicy: Fail

  # -- How policy violation should be handled. Use either `Enforce` or `Audit` (case insensitive).
  validationAction: "Audit"

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]

  # -- Exclude single Ingresses, a list of `{name, namespace}`. Both fields support wildcards (`*`, `?`) and templates.
  excludeIngresses: [ ]

requireIngressHttps:
  # -- Enable or disable the policy globally
  enabled: false

  # -- The name of the policy
  name: require-ingress-https

  # -- `Fail` rejects the request when Kyverno is unavailable or the webhook times out, `Ignore` admits it
  failurePolicy: Fail

  # -- How policy violation should be handled. Use either `Enforce` or `Audit` (case insensitive).
  validationAction: "Audit"

  # -- Exclude the policy on the given list of namespaces. Wildcards are supported (`*`, `?`).
  excludeNamespaces: [ ]

  # -- Exclude single Ingresses, a list of `{name, namespace}`. Both fields support wildcards (`*`, `?`) and templates.
  excludeIngresses: [ ]


ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "routing-oidc-forward-auth@kubernetescrd, {{ .Release.Namespace }}-strip-prefix-{{ .Release.Name }}@kubernetescrd"

  # --(String) Required, set the domain you want to serve the UI from
  host:

  # -- Hosts and paths served by the UI. `host` supports templates
  rules:
    - host: "{{ .Values.ingress.host }}"
      paths:
        - path: "/policies"
        - path: "/_nuxt"

  # -- TLS entries, each with a list of `hosts` (templates allowed) and an optional `secretName`. `[]` renders no `tls` block
  tls:
    - hosts:
        - "{{ .Values.ingress.host }}"
      # secretName: "kyverno-tls"


# https://github.com/iits-consulting/charts/tree/main/charts/common
# Global functionality can be used from the common library chart, e.g. creating External Secrets. Examples below to use
# ExternalSecrets for openIDConnect config of kyverno components or dockerconfigjson type of secrets.
#
# Pull secrets from External Secrets: prefer a ClusterExternalSecret managed outside this chart plus
# `autoInjectDockerPullSecrets.injectOnly` (see README). The ExternalSecret below in the release namespace cloned through
# `existingSecretRef` also works, with two caveats: namespaces that exist before ESO created the Secret get no clone
# until they are updated, and deleting the ExternalSecret deletes every clone unless `creationPolicy: Orphan` is set.
# autoInjectDockerPullSecrets:
#   enabled: true
#   existingSecretRef:
#     - name: kyverno-pull-secret-dockerhub
#       namespace: kyverno
#
# common:
#   externalSecret:
#     enabled: true
#     secretStore:
#       kind: ClusterSecretStore
#       name: <your-secret-store-name>
#     pull:
#       enabled: true
#       secrets:
#         kyverno-policy-reporter-ui-oidc:
#           path: "path/to/your/secret"
#           keys:
#             - name: clientId
#               remoteKey: client_id
#             - name: clientSecret
#               remoteKey: client_secret
#         kyverno-pull-secret-dockerhub:
#           # Required when cloned through existingSecretRef, otherwise deleting the ExternalSecret deletes every clone
#           creationPolicy: Orphan
#           path: "path/to/your/secret"
#           keys:
#             - name: username
#             - name: password
#           template:
#             type: "kubernetes.io/dockerconfigjson"
#             data:
#               .dockerconfigjson: >-
#                 {
#                   "auths": {
#                     "docker.io": {
#                       "auth": "{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"
#                     }
#                   }
#                 }
#         kyverno-common-signed-docker-images:
#           path: "path/to/your/secret"
#           keys:
#             - name: registryUrl
#               remoteKey: registry_url
#             - name: username
#             - name: password
#               remoteKey: token
#           template:
#             type: "kubernetes.io/dockerconfigjson"
#             data:
#               .dockerconfigjson: >-
#                 {
#                   "auths": {
#                     "{{ `{{ .registryUrl }}` }}": {
#                       "auth": "{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"
#                     }
#                   }
#                 }