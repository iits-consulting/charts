suite: CEL image pull secret policies
templates:
  - policies/pull-secret-secrets.yaml
  - policies/pull-secret-mutate.yaml
  - policies/pull-secret-generate.yaml
  - charts/common/templates/external-secrets/external-secret.yaml
release:
  namespace: kyverno
values:
  - values/pull-secrets.yaml

tests:
  - it: creates the dockerconfigjson Secret from the chart values
    template: policies/pull-secret-secrets.yaml
    asserts:
      - hasDocuments: {count: 1}
      - containsDocument: {kind: Secret, apiVersion: v1, name: pull-secret-gitlab}
      - equal: {path: type, value: kubernetes.io/dockerconfigjson}
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJyZWdpc3RyeS5naXRsYWIuY29tIjp7ImF1dGgiOiJkRzlyWlc0NmN6TmpjbVYwIn19fQ==

  - it: clones the chart Secret and keeps the credentials out of the policy
    template: policies/pull-secret-generate.yaml
    documentIndex: 2
    asserts:
      - hasDocuments: {count: 3}
      - equal:
          path: spec.variables[0].expression
          value: resource.Get("v1", "secrets", "kyverno", "pull-secret-gitlab")
      - notMatchRegex:
          path: spec.generate[0].expression
          pattern: 'dockerconfigjson|s3cret'

  - it: clones an existing secret without namespace from the release namespace
    template: policies/pull-secret-generate.yaml
    documentIndex: 1
    asserts:
      - containsDocument: {kind: GeneratingPolicy, apiVersion: policies.kyverno.io/v1, name: auto-create-docker-existing-no-ns}
      - equal:
          path: spec.variables[0].expression
          value: resource.Get("v1", "secrets", "kyverno", "existing-no-ns")

  - it: clones from the namespace of the reference and never into it
    template: policies/pull-secret-generate.yaml
    set:
      autoInjectDockerPullSecrets.secrets: null
      autoInjectDockerPullSecrets.existingSecretRef:
        - name: existing-regcred
          namespace: other-ns
    asserts:
      - hasDocuments: {count: 1}
      - equal:
          path: spec.variables[0].expression
          value: resource.Get("v1", "secrets", "other-ns", "existing-regcred")
      - equal: {path: "spec.matchConditions[0].expression", value: 'object.metadata.name != "other-ns"'}

  - it: injectOnly secrets are never cloned
    set:
      autoInjectDockerPullSecrets:
        existingSecretRef: []
        secrets: null
        injectOnly:
          - name: ps-x
    asserts:
      - hasDocuments: {count: 0}
        template: policies/pull-secret-generate.yaml
      - hasDocuments: {count: 0}
        template: policies/pull-secret-secrets.yaml
      - hasDocuments: {count: 1}
        template: policies/pull-secret-mutate.yaml

  - it: one secret for all namespaces drops the target-namespaces condition
    template: policies/pull-secret-mutate.yaml
    set:
      autoInjectDockerPullSecrets:
        existingSecretRef: []
        secrets: null
        injectOnly:
          - {name: ps-x, namespaces: [a]}
          - {name: ps-all}
    asserts:
      - lengthEqual: {path: spec.matchConditions, count: 1}
      - equal: {path: "spec.matchConditions[0].name", value: exclude-namespaces}

  # The CLI provides no namespaceObject, so the selector CEL is only checked here
  - it: namespaceSelector limits the injection per secret, ANDed with namespaces
    template: policies/pull-secret-mutate.yaml
    set:
      autoInjectDockerPullSecrets:
        existingSecretRef: []
        secrets: null
        injectOnly:
          - name: ps-x
            namespaceSelector:
              matchLabels: {pull-x: "true"}
          - name: ps-y
            namespaces: ["team-*"]
            namespaceSelector:
              matchExpressions:
                - {key: tier, operator: In, values: [prod, stage]}
                - {key: tier, operator: NotIn, values: [dev]}
                - {key: owner, operator: Exists}
                - {key: legacy, operator: DoesNotExist}
    asserts:
      - equal:
          path: spec.variables[1].expression
          value: namespaceObject.metadata.?labels.orValue({})
      - equal:
          path: spec.variables[2].expression
          value: >-
            (variables.namespace.matches(r'^(?:.*)$') && ("pull-x" in variables.namespaceLabels && variables.namespaceLabels["pull-x"] == "true") ? ["ps-x"] : []) +
            (variables.namespace.matches(r'^(?:team-.*)$') && ("tier" in variables.namespaceLabels && variables.namespaceLabels["tier"] in ["prod","stage"]) &&
            !("tier" in variables.namespaceLabels && variables.namespaceLabels["tier"] in ["dev"]) && ("owner" in variables.namespaceLabels) &&
            !("legacy" in variables.namespaceLabels) ? ["ps-y"] : [])

  - it: namespaceSelector limits the clone, the global exclusion still applies
    template: policies/pull-secret-generate.yaml
    set:
      autoInjectDockerPullSecrets:
        existingSecretRef:
          - name: regcred
            namespaces: [a]
            namespaceSelector:
              matchLabels: {pull-x: "true"}
        secrets: null
    asserts:
      - equal: {path: "spec.matchConditions[1].name", value: target-namespaces}
      - equal:
          path: spec.matchConditions[2]
          value:
            name: namespace-selector
            expression: ("pull-x" in object.metadata.?labels.orValue({}) && object.metadata.?labels.orValue({})["pull-x"] == "true")
      - equal: {path: "spec.matchConditions[3].name", value: exclude-namespaces}

  - it: an empty namespaceSelector selects every namespace
    set:
      autoInjectDockerPullSecrets:
        existingSecretRef:
          - {name: regcred, namespaceSelector: {}}
        secrets: null
    asserts:
      - equal:
          path: spec.variables[2].expression
          value: >-
            (variables.namespace.matches(r'^(?:.*)$') ? ["regcred"] : [])
        template: policies/pull-secret-mutate.yaml
      - lengthEqual: {path: spec.matchConditions, count: 2}
        template: policies/pull-secret-generate.yaml

  - it: renders nothing without secrets (no empty imagePullSecrets name)
    set:
      autoInjectDockerPullSecrets:
        existingSecretRef: []
        secrets: null
    asserts:
      - hasDocuments: {count: 0}
        template: policies/pull-secret-mutate.yaml
      - hasDocuments: {count: 0}
        template: policies/pull-secret-secrets.yaml
      - hasDocuments: {count: 0}
        template: policies/pull-secret-generate.yaml

  - it: uses secret names literally
    template: policies/pull-secret-mutate.yaml
    set:
      autoInjectDockerPullSecrets:
        existingSecretRef:
          - name: "a%sb"
        secrets: null
    asserts:
      - equal:
          path: spec.variables[2].expression
          value: >-
            (variables.namespace.matches(r'^(?:.*)$') ? ["a%sb"] : [])

  - it: an empty excludeNamespaces list removes the exclusion
    set:
      autoInjectDockerPullSecrets.excludeNamespaces: []
      autoInjectDockerPullSecrets.existingSecretRef: []
    asserts:
      - lengthEqual: {path: spec.matchConditions, count: 1}
        template: policies/pull-secret-generate.yaml
      - isNull: {path: spec.matchConditions}
        template: policies/pull-secret-mutate.yaml

  - it: renders one ExternalSecret per common.externalSecret.pull entry
    template: charts/common/templates/external-secrets/external-secret.yaml
    set:
      common.externalSecret:
        enabled: true
        secretStore: {kind: ClusterSecretStore, name: store}
        pull:
          enabled: true
          secrets:
            kyverno-pull-secret-dockerhub: {creationPolicy: Orphan, path: dockerhub, keys: [{name: username}]}
            kyverno-policy-reporter-ui-oidc: {path: oidc, keys: [{name: clientId}]}
    asserts:
      - hasDocuments: {count: 2}
