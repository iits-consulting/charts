apiVersion: v1
kind: Pod
metadata:
    name: sc-caps-add-only
    namespace: default
spec:
    containers:
        - image: nginx:1.25
          name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
                add:
                    - NET_ADMIN
                drop:
                    - ALL
            privileged: false
    securityContext:
        runAsNonRoot: true
        seccompProfile:
            type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata:
    name: sc-container-partial
    namespace: default
spec:
    containers:
        - image: nginx:1.25
          name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
                drop:
                    - ALL
            privileged: false
            readOnlyRootFilesystem: true
        - image: nginx:1.25
          name: sidecar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
                drop:
                    - ALL
            privileged: true
    securityContext:
        runAsNonRoot: true
        seccompProfile:
            type: RuntimeDefault
---
