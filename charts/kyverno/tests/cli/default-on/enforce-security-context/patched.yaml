apiVersion: v1
kind: Pod
metadata:
    name: sc-pod-full
    namespace: default
spec:
    containers:
        - image: nginx:1.25
          name: app
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
                drop:
                    - NET_RAW
            privileged: true
    securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
            type: Unconfined
---
