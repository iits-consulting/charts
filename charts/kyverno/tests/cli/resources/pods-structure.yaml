apiVersion: v1
kind: Pod
metadata:
  name: struct-ephemeral
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.25
  ephemeralContainers:
    - name: debug
      image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: struct-multi-bad-last
  namespace: default
spec:
  containers:
    - name: app
      image: mirror.example.com/proxy/app:v1
    - name: sidecar
      image: ghcr.io/other/app:v1
---
apiVersion: v1
kind: Pod
metadata:
  name: struct-pullsecrets
  namespace: default
spec:
  imagePullSecrets:
    - name: user-secret
  containers:
    - name: app
      image: nginx:1.25
---
apiVersion: v1
kind: Pod
metadata:
  name: struct-pullsecrets-dup
  namespace: default
spec:
  imagePullSecrets:
    - name: pull-secret-gitlab
    - name: user-secret
  containers:
    - name: app
      image: nginx:1.25
---
apiVersion: v1
kind: Pod
metadata:
  name: struct-bad-ephemeral
  namespace: default
spec:
  containers:
    - name: app
      image: ghcr.io/org/app:v1
  ephemeralContainers:
    - name: debug
      image: busybox:1.36
