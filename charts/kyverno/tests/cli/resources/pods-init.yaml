# Pods with initContainers.
# Pods varying the container layout, not the image reference.
apiVersion: v1
kind: Pod
metadata:
  name: struct-init
  namespace: default
spec:
  initContainers:
    - name: init
      image: busybox:1.36
  containers:
    - name: app
      image: nginx:1.25
---
apiVersion: v1
kind: Pod
metadata:
  name: struct-init-ghcr
  namespace: default
spec:
  initContainers:
    - name: init
      image: ghcr.io/org/app:v1
    - name: init2
      image: ghcr.io/other/tool:2
  containers:
    - name: app
      image: ghcr.io/org/app:v1
---
apiVersion: v1
kind: Pod
metadata:
  name: struct-multi
  namespace: default
spec:
  initContainers:
    - name: init
      image: busybox:1.36
  containers:
    - name: app
      image: ghcr.io/org/app:v1
    - name: sidecar
      image: docker.io/library/envoy:1.30
    - name: other
      image: ghcr.io/other/app:v1
---
apiVersion: v1
kind: Pod
metadata:
  name: struct-allowed-all
  namespace: default
spec:
  initContainers:
    - name: init
      image: ghcr.io/org/init:1
  containers:
    - name: app
      image: ghcr.io/org/app:v1
    - name: sidecar
      image: mirror.example.com/proxy/side:2
  ephemeralContainers:
    - name: debug
      image: localhost:5000/debug:1
