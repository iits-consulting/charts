apiVersion: v1
kind: Pod
metadata:
  name: img-plain
  namespace: default
spec:
  containers:
    - image: mirror.example.com/docker.io/library/nginx
      name: app
---
apiVersion: v1
kind: Pod
metadata:
  name: img-ghcr-org
  namespace: default
spec:
  containers:
    - image: ghcr.io/org/app:v1
      name: app
---
apiVersion: v1
kind: Pod
metadata:
  name: img-ghcr-other
  namespace: default
spec:
  containers:
    - image: mirror.example.com/ghcr.io/other/app:v1
      name: app
---
apiVersion: v1
kind: Pod
metadata:
  name: img-mirror
  namespace: default
spec:
  containers:
    - image: mirror.example.com/proxy/app:v1
      name: app
---
apiVersion: v1
kind: Pod
metadata:
  name: img-busybox-excluded
  namespace: default
spec:
  containers:
    - image: docker.io/library/busybox:1.36
      name: app
---
apiVersion: v1
kind: Pod
metadata:
  name: struct-init-ghcr
  namespace: default
spec:
  containers:
    - image: ghcr.io/org/app:v1
      name: app
  initContainers:
    - image: ghcr.io/org/app:v1
      name: init
    - image: mirror.example.com/ghcr.io/other/tool:2
      name: init2
