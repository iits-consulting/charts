{{- with .Values.replaceImageRegistry -}}
  {{- if .enabled -}}
    {{- $target := .target | trimSuffix "/" -}}
    {{- /* the target ends up in a regex replacement string, where a backslash is an escape */ -}}
    {{- if contains "\\" $target -}}
      {{- fail "replaceImageRegistry.target must not contain backslashes" -}}
    {{- end -}}
    {{- /* RE2 keeping everything after the last `/`, or everything after the registry (first segment with `.` or `:`) */ -}}
    {{- $pattern := ternary "^(?:[^/]*[.:][^/]*/|localhost/)?(.*)$" "^(?:.*/)?([^/]*)$" .keepRepositoryPath -}}
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ .name }}
  labels:
    {{- include "kyverno.policyLabels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Replace Image Registry
    policies.kyverno.io/category: DockerImage
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every third party image registry of containers and initContainers is rewritten to `{{ $target }}`:
      {{ if .keepRepositoryPath -}}
      `registry.corp.com/org/image:tag` becomes `{{ $target }}/org/image:tag`.
      {{- else -}}
      `registry.corp.com/org/image:tag` becomes `{{ $target }}/image:tag`.
      {{- end }}
      A registry is a first path segment with `.` or `:` (or `localhost`), Docker Hub images are not normalized: `nginx` becomes
      `{{ $target }}/nginx`. Images that already start with `{{ $target }}/` or match `excludeRegistries` are left alone. Images that
      do not exist in the target registry can not be deployed.
spec:
  failurePolicy: {{ include "kyverno.failurePolicy" . }}
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  {{- with .excludeNamespaces }}
  matchConditions:
    {{- include "kyverno.excludeNamespacesCondition" . | nindent 4 }}
  {{- end }}
  variables:
    - name: target
      expression: {{ $target | toJson | squote }}
    - name: pattern
      expression: r'{{ $pattern }}'
    {{- if .excludeRegistries }}
    - name: excluded
      expression: r'{{ include "kyverno.globToRegex" .excludeRegistries }}'
    {{- end }}
    {{- include "kyverno.imageVariables" (dict "image" (include "kyverno.replaceImage" (dict "excluded" .excludeRegistries) | nindent 4)) | nindent 4 }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          {{- include "kyverno.applyContainers" (dict "pod" "" "init" "initContainers") | nindent 10 }}
  {{- end -}}
{{- end }}
