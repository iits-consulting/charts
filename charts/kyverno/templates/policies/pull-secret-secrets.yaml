{{- /* Secrets created from the chart values in the release namespace. The generate policies clone them into every namespace,
       validate policies (image verification) read them from here. */ -}}
{{- with .Values.autoInjectDockerPullSecrets -}}
  {{- if .enabled -}}
    {{- range $registryName, $registry := .secrets }}
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: pull-secret-{{ $registryName }}
data:
  .dockerconfigjson: {{ include "kyverno.dockerconfigjson" $registry }}
---
    {{- end }}
  {{- end -}}
{{- end }}
