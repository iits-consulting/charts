{{ with .Values.disallowUnspecifiedDockerRegistries }}
{{ if .enabled }}
{{- /* ponytail: the agent switch lives under disallowUnsignedImages (chart 3.6.0), one block for both policies */}}
{{- $agent := $.Values.disallowUnsignedImages.kumoopsAgent | default dict }}
{{- $allowed := .allowedRegistries | default list }}
{{- if $agent.enabled }}
{{- $allowed = append $allowed $agent.image | uniq }}
{{- end }}

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ .name }}
  annotations:
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/category: DockerImage
    policies.kyverno.io/title: Disallow unspecified Docker Registries
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Docker Images are only allowed from specific Registries
spec:
  rules:
    - name: "{{ .name }}-rule"
      match:
        any:
          - resources:
              operations:
                - CREATE
                - UPDATE
              kinds:
                - Pod
      validate:
        failureAction: {{ .validationAction }}
        message: >-
          Unknown image registries. Expected images to match: {{ join " | " $allowed | quote}}.
          Found:
            ephemeralContainers={{`{{ request.object.spec.ephemeralContainers[*].image }}`}},
            initContainers={{`{{ request.object.spec.initContainers[*].image }}`}},
            containers={{`{{ request.object.spec.containers[*].image }}`}}
        pattern:
          spec:
            =(ephemeralContainers):
              - image: {{ join " | " $allowed | quote}}
            =(initContainers):
              - image: {{ join " | " $allowed | quote}}
            containers:
              - image: {{ join " | " $allowed | quote}}
      {{- if .excludeNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
              {{- range .excludeNamespaces }}
                - {{ . }}
              {{- end }}
      {{- end }}
{{ end }}
{{ end }}