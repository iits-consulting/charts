{{- with .Values.autoInjectDockerPullSecrets -}}
  {{- if .enabled -}}
    {{- $secrets := include "kyverno.pullSecrets" $ | fromJsonArray -}}
    {{- if $secrets -}}
      {{- $terms := list -}}
      {{- $union := list -}}
      {{- range $secrets -}}
        {{- $namespaces := .namespaces | default (list "*") -}}
        {{- $condition := printf "variables.namespace.matches(r'%s')" (include "kyverno.globToRegex" $namespaces) -}}
        {{- with .selector -}}
          {{- $condition = printf "%s && %s" $condition (include "kyverno.labelSelectorMatches" (dict "selector" . "labels" "variables.namespaceLabels")) -}}
        {{- end -}}
        {{- $terms = append $terms (printf "(%s ? [%s] : [])" $condition (toJson .name)) -}}
        {{- $union = concat $union $namespaces -}}
      {{- end -}}
      {{- $union = $union | uniq -}}
      {{- $conditions := list -}}
      {{- if not (has "*" $union) -}}
        {{- $conditions = append $conditions (include "kyverno.targetNamespacesCondition" $union) -}}
      {{- end -}}
      {{- with .excludeNamespaces -}}
        {{- $conditions = append $conditions (include "kyverno.excludeNamespacesCondition" .) -}}
      {{- end -}}
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-image-pull-secret
  labels:
    {{- include "kyverno.policyLabels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Add imagePullSecrets
    policies.kyverno.io/category: DockerImage
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images coming from certain registries require authentication in order to pull them,
      and the kubelet uses this information in the form of an imagePullSecret to pull
      those images on behalf of your Pod. This policy will mutate the Pod to add all
      imagePullSecrets that target the namespace of the Pod, the ones the Pod already has are kept.
spec:
  failurePolicy: {{ include "kyverno.failurePolicy" . }}
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  {{- with $conditions }}
  matchConditions:
    {{- join "\n" . | nindent 4 }}
  {{- end }}
  variables:
    - name: namespace
      expression: object.metadata.?namespace.orValue("")
    - name: namespaceLabels
      expression: namespaceObject.metadata.?labels.orValue({})
    # One term per pull secret: its name if the namespace matches its `namespaces` and `namespaceSelector`
    - name: secretNames
      expression: >-
        {{- join " +\n" $terms | nindent 8 }}
  mutations:
    # imagePullSecrets is an atomic list, so ApplyConfiguration cannot be used
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.secretNames.size() == 0 ? [] :
          has(object.spec.imagePullSecrets)
          ? variables.secretNames.filter(n, !object.spec.imagePullSecrets.exists(s, s.name == n)).map(n, JSONPatch{op: "add", path: "/spec/imagePullSecrets/-", value: {"name": n}})
          : [JSONPatch{op: "add", path: "/spec/imagePullSecrets", value: variables.secretNames.map(n, {"name": n})}]
    {{- end -}}
  {{- end -}}
{{- end }}
