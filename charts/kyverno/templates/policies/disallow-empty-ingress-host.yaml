{{- with .Values.disallowEmptyIngressHost -}}
  {{- if .enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ .name }}
  labels:
    {{- include "kyverno.policyLabels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Disallow empty Ingress host
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/minversion: 1.16.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/description: >-
      An ingress resource needs to define an actual host name
      in order to be valid. This policy ensures that there is a
      hostname for each rule defined.
spec:
  validationActions:
    {{- include "kyverno.validationActions" .validationAction | nindent 4 }}
  failurePolicy: {{ include "kyverno.failurePolicy" . }}
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  {{- if or .excludeNamespaces .excludeIngresses }}
  matchConditions:
    {{- include "kyverno.ingressMatchConditions" (dict "root" $ "values" .) | nindent 4 }}
  {{- end }}
  validations:
    - expression: >-
        object.spec.?rules.orValue([]).all(rule, rule.?host.orValue("") != "")
      message: "The Ingress host name must be defined, it is not allowed to be empty."
  {{- end -}}
{{- end }}
