{{- with .Values.prependCustomImageRegistry -}}
  {{- if .enabled -}}
    {{- $registry := .registry | trimSuffix "/" -}}
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ .name }}
  labels:
    {{- include "kyverno.policyLabels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Prepend custom image registry
    policies.kyverno.io/category: DockerImage
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every image reference of containers and initContainers is prefixed with `{{ $registry }}`:
      `nginx:1` becomes `{{ $registry }}/docker.io/library/nginx:1` and `registry.corp.com/image:tag`
      becomes `{{ $registry }}/registry.corp.com/image:tag`.
      Images without a registry (first path segment without `.` or `:`) are Docker Hub images and get `docker.io/library/` when
      they have no path. Images that already start with `{{ $registry }}/` or match `excludeRegistries` are left alone.
spec:
  failurePolicy: {{ include "kyverno.failurePolicy" . }}
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  {{- with .excludeNamespaces }}
  matchConditions:
    {{- include "kyverno.excludeNamespacesCondition" . | nindent 4 }}
  {{- end }}
  variables:
    - name: registry
      expression: {{ $registry | toJson | squote }}
    {{- if .excludeRegistries }}
    - name: excluded
      expression: r'{{ include "kyverno.globToRegex" .excludeRegistries }}'
    {{- end }}
    {{- include "kyverno.imageVariables" (dict "image" (include "kyverno.prependImage" (dict "excluded" .excludeRegistries) | nindent 4)) | nindent 4 }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          {{- include "kyverno.applyContainers" (dict "pod" "" "init" "initContainers") | nindent 10 }}
  {{- end -}}
{{- end }}
