{{- /* One GeneratingPolicy per cloned pull secret (secrets and existingSecretRef, not injectOnly), cloning it into its
       target namespaces except its own */ -}}
{{- with .Values.autoInjectDockerPullSecrets -}}
  {{- if .enabled -}}
    {{- $excluded := .excludeNamespaces -}}
    {{- range include "kyverno.pullSecrets" $ | fromJsonArray }}
      {{- if .clone }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: {{ .clone.policyName }}
  labels:
    {{- include "kyverno.policyLabels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Clone pull secret into namespaces
    policies.kyverno.io/category: DockerImage
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Clones the Secret `{{ .name }}` of namespace `{{ .clone.namespace }}` into
      {{ if .namespaces }}the namespaces matching `{{ join ", " .namespaces }}`{{ else }}every namespace{{ end }}{{ if .selector }} with matching labels{{ end }}, except the excluded ones.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: not-source-namespace
      expression: object.metadata.name != {{ .clone.namespace | toJson }}
    {{- with .namespaces }}
    - name: target-namespaces
      expression: >-
        object.metadata.name.matches(r'{{ include "kyverno.globToRegex" . }}')
    {{- end }}
    {{- with .selector }}
    - name: namespace-selector
      expression: >-
        {{- include "kyverno.labelSelectorMatches" (dict "selector" . "labels" "object.metadata.?labels.orValue({})") | nindent 8 }}
    {{- end }}
    {{- with $excluded }}
    - name: exclude-namespaces
      expression: >-
        !object.metadata.name.matches(r'{{ include "kyverno.globToRegex" . }}')
    {{- end }}
  variables:
    - name: source
      expression: resource.Get("v1", "secrets", {{ .clone.namespace | toJson }}, {{ .name | toJson }})
  generate:
    - expression: generator.Apply(object.metadata.name, [variables.source])
---
      {{- end }}
    {{- end }}
  {{- end -}}
{{- end }}
