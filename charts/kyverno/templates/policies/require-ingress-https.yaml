{{- /* Adapted from kyverno/policies other-vpol/require-ingress-https (Apache-2.0) */ -}}
{{- with .Values.requireIngressHttps -}}
  {{- if .enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ .name }}
  labels:
    {{- include "kyverno.policyLabels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Require Ingress TLS
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/description: >-
      Ingress resources should only allow secure traffic. Every Ingress must define TLS in its spec. Ingresses whose
      TLS is terminated by controller annotations (for example Traefik `router.tls`) have to be excluded.
spec:
  validationActions:
    {{- include "kyverno.validationActions" .validationAction | nindent 4 }}
  failurePolicy: {{ include "kyverno.failurePolicy" . }}
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  {{- if or .excludeNamespaces .excludeIngresses }}
  matchConditions:
    {{- include "kyverno.ingressMatchConditions" (dict "root" $ "values" .) | nindent 4 }}
  {{- end }}
  validations:
    - expression: "size(object.spec.?tls.orValue([])) > 0"
      message: "TLS must be defined for the Ingress."
  {{- end -}}
{{- end }}
