{{- $reporter := index .Values "policy-reporter" }}
{{- with .Values.ingress }}
{{- if and .enabled $reporter.install $reporter.ui.enabled }}
{{- $_ := required "ingress.host is required when ingress.enabled is true" .host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kyverno.fullname" $ }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ tpl . $ | quote }}
        {{- end }}
      {{- with .secretName }}
      secretName: {{ tpl . $ | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .rules }}
    - host: {{ tpl .host $ | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: policy-reporter-ui
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
