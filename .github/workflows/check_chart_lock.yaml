name: Check Chart.lock

on:
  push:
    branches-ignore:
      - "main"
    paths:
      - 'charts/**/Chart.yaml'

env:
  HELM_VERSION: v3.22.0

jobs:
  find-charts:
    name: Find Changed Charts
    runs-on: ubuntu-latest
    outputs:
      charts: "${{ steps.get-changed-charts.outputs.charts }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed charts with a Chart.lock
        id: get-changed-charts
        run: |
          git fetch origin main
          changed_charts=$(git diff --name-only origin/main...HEAD -- 'charts/*/Chart.yaml' \
            | awk -F/ '{print $2}' | sort -u)

          charts=$(for c in $changed_charts; do
            [ -f "charts/$c/Chart.lock" ] && echo "$c"
          done | jq -R . | jq -sc .)

          echo "charts=${charts}" >> $GITHUB_OUTPUT

  check-chart-lock:
    name: Check
    needs: find-charts
    if: ${{ needs.find-charts.outputs.charts != '[]' }}
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.find-charts.outputs.charts) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Refresh Chart.lock for ${{ matrix.chart }}
        run: helm dependency update charts/${{ matrix.chart }}

      - name: Verify Chart.lock is up to date for ${{ matrix.chart }}
        run: |
          if ! git diff --exit-code -- charts/${{ matrix.chart }}/Chart.lock; then
            echo "::error::charts/${{ matrix.chart }}/Chart.lock is out of date. Run 'helm dependency update charts/${{ matrix.chart }}' and commit the result."
            exit 1
          fi
