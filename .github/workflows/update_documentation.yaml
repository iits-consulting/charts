# Regenerates the README of the targeted charts of a branch. Terms are defined in GLOSSARY.md.

name: Update helm chart README files

on:
  push:
    branches-ignore:
      - "main"
    paths:
      - 'charts/**/values.yaml'
      - 'charts/**/Chart.yaml'
      - 'README.md.gotmpl'
      - '.github/workflows/update_documentation.yaml'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup helm-docs
        uses: gabe565/setup-helm-docs-action@v1
      - name: Update README.md files of targeted charts
        shell: bash
        run: |
          targeted_charts=$(.github/scripts/target-charts.sh origin/main \
            | sed -n 's/^targeted_charts=//p' | jq -r 'map("charts/" + .) | join(",")')

          if [ -z "$targeted_charts" ]; then
            echo "No targeted charts, nothing to update."
            exit 0
          fi

          helm-docs -c charts -g "$targeted_charts" -l debug -t README.md.gotmpl
      - name: Commit files
        shell: "bash {0}"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -a -m "Auto update of README.md files" || echo "Nothing changed apparently"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
