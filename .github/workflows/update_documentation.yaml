# Regenerates the README of the changed charts of a branch, or of every chart when the README
# template or this workflow changed. Terms are defined in GLOSSARY.md.

name: Update helm chart README files

on:
  push:
    branches-ignore:
      - "main"
    paths:
      - 'charts/**/values.yaml'
      - 'charts/**/Chart.yaml'
      - 'README.md.gotmpl'
      - '.github/workflows/update_documentation.yaml'
      - '.github/scripts/**'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup helm-docs
        uses: gabe565/setup-helm-docs-action@v1
      - name: Find charts whose README needs regenerating
        id: target-charts
        shell: bash
        run: .github/scripts/target-charts.sh origin/main | tee -a "$GITHUB_OUTPUT"
      - name: Update README.md files
        if: ${{ steps.target-charts.outputs.readme_charts != '[]' }}
        shell: bash
        env:
          README_CHARTS: ${{ steps.target-charts.outputs.readme_charts }}
        run: |
          # helm-docs expects chart paths including the search root, e.g. charts/akhq.
          chart_paths=$(jq -r 'map("charts/" + .) | join(",")' <<< "$README_CHARTS")
          helm-docs -c charts -g "$chart_paths" -l debug -t README.md.gotmpl
      - name: Commit files
        shell: "bash {0}"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -a -m "Auto update of README.md files" || echo "Nothing changed apparently"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
